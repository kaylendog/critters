# Development. Postgres only by default:
#   docker compose -f docker/compose.dev.yml up -d
# Then run the binaries with `cargo run -p critter-server` and
# `cargo run -p critter-discord`. To build and run everything in Docker:
#   docker compose -f docker/compose.dev.yml --profile app up --build
name: critters-dev

services:
  postgres:
    extends: { file: common.yml, service: postgres }
    ports:
      - "5432:5432"

  server:
    extends: { file: common.yml, service: server }
    profiles: [app]
    build:
      context: ..
      target: critter-server
      args:
        BIN: critter-server
    environment:
      # Development is where labelling happens, so do not overwrite labels
      # with the baked-in `weights.json` on every start.
      IMPORT_FILE: ""
    ports:
      - "8080:8080"

  discord:
    extends: { file: common.yml, service: discord }
    profiles: [app]
    build:
      context: ..
      target: critter-discord
      args:
        BIN: critter-discord
    ports:
      - "8081:8081"

volumes:
  pgdata:
  appdata:
