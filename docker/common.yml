# Service definitions shared by `compose.dev.yml` and `compose.prod.yml`,
# which pull them in with `extends`. Not meant to be run on its own.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: critters
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-critters}
      POSTGRES_DB: critter_server
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the pushers' databases on first start.
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U critters"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://critters:${POSTGRES_PASSWORD:-critters}@postgres/critter_server
      # Leave unset to have the server generate one and print it in the logs.
      ADMIN_TOKEN: ${SERVER_ADMIN_TOKEN:-}
      USER_AGENT: ${USER_AGENT:-critter-server (https://github.com/kaylendog/critters)}
      RUST_LOG: ${RUST_LOG:-critter_server=info}
    volumes:
      - appdata:/data

  discord:
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_started
    environment:
      DATABASE_URL: postgres://critters:${POSTGRES_PASSWORD:-critters}@postgres/critter_discord
      SERVER_URL: http://server:8080
      PUBLIC_URL: ${DISCORD_PUBLIC_URL:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      RUST_LOG: ${RUST_LOG:-critter_discord=info}
