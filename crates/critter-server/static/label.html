<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critter labelling</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; min-height: 100vh; box-sizing: border-box; }
  header { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  header input, header select, header button { font: inherit; padding: .4rem .6rem; }
  #pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; flex: 1; min-height: 0; }
  figure { margin: 0; cursor: pointer; display: flex; flex-direction: column; border: 3px solid transparent; border-radius: 8px; overflow: hidden; position: relative; }
  figure:hover, figure:focus-visible { border-color: Highlight; outline: none; }
  figure img { width: 100%; height: 70vh; object-fit: contain; background: #0003; }
  /* While a pair loads the old picture is hidden and a placeholder sits on top,
     so there is never a moment where a stale image looks like a real choice. */
  figure.loading { cursor: wait; }
  figure.loading img { visibility: hidden; }
  figure.loading::after { content: "Loading…"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.2rem; opacity: .6; }
  figcaption { padding: .4rem; font-size: .9rem; opacity: .8; }
  #hide { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  #hide button { font: inherit; padding: .4rem .6rem; justify-self: center; opacity: .7; }
  #status { min-height: 1.5rem; opacity: .8; }
  kbd { border: 1px solid currentColor; border-radius: 3px; padding: 0 .3rem; font-size: .85em; }
</style>
</head>
<body>
<header>
  <label>Token <input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="off"></label>
  <label>Species
    <select id="species">
      <option>wolf</option><option>coyote</option><option>fox</option>
    </select>
  </label>
  <button id="skip">Skip</button>
  <button id="train">Train</button>
  <span>Pairs: <strong id="count">–</strong></span>
  <span>Pick the better photo. <kbd>A</kbd>/<kbd>←</kbd> left, <kbd>B</kbd>/<kbd>→</kbd> right, <kbd>S</kbd> skip, <kbd>1</kbd>/<kbd>2</kbd> never show.</span>
</header>
<section id="pair">
  <figure id="a" tabindex="0"><img alt="Candidate A"><figcaption></figcaption></figure>
  <figure id="b" tabindex="0"><img alt="Candidate B"><figcaption></figcaption></figure>
</section>
<section id="hide">
  <button data-side="a">Never show left</button>
  <button data-side="b">Never show right</button>
</section>
<p id="status"></p>
<script>
  // Token and species persist across reloads. The token only ever goes to
  // this origin as a bearer header.
  const token = document.getElementById('token');
  const species = document.getElementById('species');
  const status = document.getElementById('status');
  const count = document.getElementById('count');
  token.value = localStorage.getItem('token') || '';
  species.value = localStorage.getItem('species') || 'fox';
  token.addEventListener('change', () => { localStorage.setItem('token', token.value); load(); });
  species.addEventListener('change', () => { localStorage.setItem('species', species.value); load(); });

  let current = null;

  async function api(path, options = {}) {
    const response = await fetch(path, {
      ...options,
      headers: { 'Authorization': `Bearer ${token.value}`, 'Content-Type': 'application/json', ...options.headers },
    });
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    return response.status === 204 ? null : response.json();
  }

  // Resolves once the picture has loaded or failed, so a pair only becomes
  // pickable when both candidates are actually on screen.
  function show(side, image) {
    const figure = document.getElementById(side);
    const img = figure.querySelector('img');
    figure.querySelector('figcaption').textContent = image.source_url;
    return new Promise((resolve) => {
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = image.image_url;
    });
  }

  function setLoading(loading) {
    for (const figure of document.querySelectorAll('figure')) {
      figure.classList.toggle('loading', loading);
      if (loading) {
        figure.querySelector('img').removeAttribute('src');
        figure.querySelector('figcaption').textContent = '';
      }
    }
  }

  async function load() {
    // Drop the old pair immediately so clicks during the swap do nothing.
    current = null;
    status.textContent = '';
    setLoading(true);
    try {
      const pair = await api(`/label/pair?species=${encodeURIComponent(species.value)}`);
      const [a, b] = await Promise.all([show('a', pair.a), show('b', pair.b)]);
      if (!a || !b) status.textContent = 'An image failed to load. Skip, or hide it.';
      current = pair;
      count.textContent = pair.pairs;
    } catch (error) {
      status.textContent = error.message === '401 Unauthorized' ? 'Enter the admin token.' : `Could not load a pair: ${error.message}`;
    } finally {
      setLoading(false);
    }
  }

  async function pick(winner) {
    if (!current) return;
    const loser = winner === 'a' ? 'b' : 'a';
    try {
      await api('/label', { method: 'POST', body: JSON.stringify({ winner: current[winner].id, loser: current[loser].id }) });
      await load();
    } catch (error) {
      status.textContent = `Could not save: ${error.message}`;
    }
  }

  // Hidden images never appear in slots or pairs again. No confirmation, since
  // the worst case is one fewer photo in the pool.
  async function hide(side) {
    if (!current) return;
    try {
      await api('/label/hide', { method: 'POST', body: JSON.stringify({ id: current[side].id }) });
      status.textContent = `Hidden #${current[side].id}.`;
      await load();
    } catch (error) {
      status.textContent = `Could not hide: ${error.message}`;
    }
  }

  async function train() {
    status.textContent = 'Training…';
    try {
      const result = await api('/label/train', { method: 'POST' });
      const eligible = Object.entries(result.eligible).map(([k, v]) => `${k} ${v}`).join(', ');
      status.textContent = `Trained on ${result.pairs} pairs. Eligible: ${eligible}.`;
    } catch (error) {
      status.textContent = `Training failed: ${error.message}`;
    }
  }

  document.getElementById('a').addEventListener('click', () => pick('a'));
  document.getElementById('b').addEventListener('click', () => pick('b'));
  document.getElementById('skip').addEventListener('click', load);
  document.querySelectorAll('#hide button').forEach((button) => button.addEventListener('click', () => hide(button.dataset.side)));
  document.getElementById('train').addEventListener('click', train);
  document.addEventListener('keydown', (event) => {
    if (event.target === token) return;
    const key = event.key.toLowerCase();
    if (key === 'a' || key === 'arrowleft') pick('a');
    else if (key === 'b' || key === 'arrowright') pick('b');
    else if (key === 's') load();
    else if (key === '1') hide('a');
    else if (key === '2') hide('b');
  });

  load();
</script>
</body>
</html>
