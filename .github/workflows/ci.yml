name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # sqlx::query!() checks against the committed `.sqlx/` data instead of a live database.
  SQLX_OFFLINE: "true"
  # Pinned nightly for rustfmt and clippy. `.rustfmt.toml` uses nightly-only options.
  # Format locally with `cargo +nightly-2026-10-09 fmt`.
  NIGHTLY: nightly-2026-10-09

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component rustfmt,clippy
          rustup default "$NIGHTLY"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The runner image already ships stable Rust.
      - run: rustup update stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test
