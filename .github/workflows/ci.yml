name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # sqlx::query!() checks against each crate's committed `.sqlx/` data instead of a live database.
  SQLX_OFFLINE: "true"
  # Pinned nightly for rustfmt and clippy. `.rustfmt.toml` uses nightly-only options.
  # Format locally with `cargo +nightly-2026-10-09 fmt --all`.
  NIGHTLY: nightly-2026-10-09

jobs:
  lint:
    name: ci-${{ matrix.crate }} - Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    strategy:
      fail-fast: false
      matrix:
        crate: [server, types, discord]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component rustfmt,clippy
          rustup default "$NIGHTLY"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.crate }}
      - run: cargo fmt -p "critter-$CRATE" --check
        env:
          CRATE: ${{ matrix.crate }}
      - run: cargo clippy -p "critter-$CRATE" --all-targets -- -D warnings
        env:
          CRATE: ${{ matrix.crate }}

  check:
    name: ci-${{ matrix.crate }} - Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    strategy:
      fail-fast: false
      matrix:
        crate: [server, types, discord]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The runner image already ships stable Rust.
      - run: rustup update stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.crate }}
      - run: cargo test -p "critter-$CRATE"
        env:
          CRATE: ${{ matrix.crate }}

  machete:
    name: Machete
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      security-events: write # upload SARIF results
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          persona: pedantic
