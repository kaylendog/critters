[package]
name = "daily-critters"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Hourly and daily photos of wolves, coyotes and foxes, filtered by your own taste."

[dependencies]
anyhow = "1"
axum = "0.8"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
image = "0.25"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "webpki-roots", "http2", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "chrono", "uuid", "derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
